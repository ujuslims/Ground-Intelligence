name: backend-ci

# Runs the Alembic migration against a real Postgres service container
# (not SQLite) and the pytest suite on every push/PR touching backend/.
# This satisfies PIGL Final Authorization item 16 ("testing is mandatory")
# by making it structurally impossible to merge a change that breaks the
# migration or fails a test -- it doesn't rely on someone remembering to
# run tests locally.

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gi
          POSTGRES_PASSWORD: gi
          POSTGRES_DB: ground_intelligence_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GI_DATABASE_URL: postgresql+psycopg2://gi:gi@localhost:5432/ground_intelligence_ci
      GI_ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migration against Postgres
        run: alembic upgrade head

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Verify migration is reversible (downgrade to base)
        run: alembic downgrade base

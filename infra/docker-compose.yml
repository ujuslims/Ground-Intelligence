# Local development only. Staging/production use Supabase (managed
# Postgres/PostGIS + S3-compatible storage) instead of these containers --
# see docs/INFRASTRUCTURE_DECISIONS.md. Running this locally means a
# developer never needs Supabase credentials just to get the app running.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gi
      POSTGRES_PASSWORD: gi
      POSTGRES_DB: ground_intelligence
    ports:
      - "5432:5432"
    volumes:
      - gi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gi"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - gi_minio_data:/data

volumes:
  gi_postgres_data:
  gi_minio_data:
